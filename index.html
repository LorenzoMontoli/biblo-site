<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Biblo</title>
	<meta name="description" content="Biblo reads your PDFs on your own computer and lets you question them in plain language. Every answer cites the document and the page. Free app for Windows." />
	<link rel="canonical" href="https://lorenzomontoli.github.io/biblo-site/en/" />
	<link rel="alternate" hreflang="it" href="https://lorenzomontoli.github.io/biblo-site/it/" />
	<link rel="alternate" hreflang="en" href="https://lorenzomontoli.github.io/biblo-site/en/" />
	<link rel="alternate" hreflang="fr" href="https://lorenzomontoli.github.io/biblo-site/fr/" />
	<link rel="alternate" hreflang="es" href="https://lorenzomontoli.github.io/biblo-site/es/" />
	<link rel="alternate" hreflang="de" href="https://lorenzomontoli.github.io/biblo-site/de/" />
	<link rel="alternate" hreflang="x-default" href="https://lorenzomontoli.github.io/biblo-site/en/" />
	<link rel="icon" href="./assets/img/favicon.png" type="image/png" />
	<link rel="stylesheet" href="./assets/style.css" />
	<script>
		(function () {
			var langs = ["it","en","fr","es","de"];
			var saved = null;
			try { saved = localStorage.getItem('biblo_site_lang'); } catch (e) {}
			var want = saved && langs.indexOf(saved) >= 0 ? saved : null;
			if (!want) {
				var nav = (navigator.languages || [navigator.language || '']).map(function (l) {
					return String(l).slice(0, 2).toLowerCase();
				});
				for (var i = 0; i < nav.length && !want; i++) {
					if (langs.indexOf(nav[i]) >= 0) want = nav[i];
				}
			}
			location.replace('./' + (want || 'en') + '/');
		})();
	</script>
</head>
<body>
	<main class="wrap" style="padding-block:6rem;text-align:center">
		<h1 style="font-family:var(--font-display)">Biblo</h1>
		<p style="color:var(--muted);margin-top:1rem">Scegli la lingua · Choose your language</p>
		<ul style="list-style:none;padding:0;margin-top:2rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap"><li><a href="./it/" hreflang="it" lang="it">Italiano</a></li><li><a href="./en/" hreflang="en" lang="en">English</a></li><li><a href="./fr/" hreflang="fr" lang="fr">Français</a></li><li><a href="./es/" hreflang="es" lang="es">Español</a></li><li><a href="./de/" hreflang="de" lang="de">Deutsch</a></li></ul>
	</main>
</body>
</html>
